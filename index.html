<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#111">
<title>מחשבון קלוריות</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#111;color:#eee;padding-bottom:80px}
header{padding:16px;background:#1b1b1b;position:sticky;top:0;z-index:5}
.dateRow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dateRow button{background:none;border:none;color:#8bc34a;font-size:24px;padding:4px 12px}
.big{font-size:34px;font-weight:700}
.bar{height:10px;background:#333;border-radius:6px;overflow:hidden;margin:8px 0}
.bar div{height:100%;background:#4caf50;transition:width .3s}
.bar.over div{background:#e53935}
.sub{opacity:.7;font-size:14px}
main{padding:12px}
.card{background:#1e1e1e;border-radius:12px;padding:12px;margin-bottom:10px}
.entry{display:flex;justify-content:space-between;align-items:center;gap:8px}
.entry .n{font-weight:600}
.del{background:#333;border:none;color:#e57373;border-radius:8px;padding:6px 10px;font-size:16px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#1b1b1b;border-top:1px solid #333}
nav button{flex:1;background:none;border:none;color:#aaa;padding:14px 0;font-size:15px}
nav button.on{color:#8bc34a;font-weight:700}
.view{display:none}.view.on{display:block}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #444;background:#222;color:#eee;font-size:17px;margin:6px 0}
label{font-size:14px;opacity:.8}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:#2e7d32;color:#fff;font-size:18px;margin-top:8px}
.btn.gray{background:#333}
video{width:100%;border-radius:12px;background:#000;max-height:45vh;object-fit:cover}
.res{cursor:pointer}
.msg{padding:10px;text-align:center;opacity:.8}
.row{display:flex;gap:8px}.row>*{flex:1}
.macros{display:flex;gap:10px;margin-top:8px;font-size:14px}.macros>div{flex:1}
.bar.sm{height:6px;margin:4px 0 0}
.pic{flex:0 0 44px;width:44px;height:44px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:contain;padding:3px}
.ph{font-size:10px;color:#999;text-align:center;line-height:1.2}
.pic.big{flex-basis:72px;width:72px;height:72px;font-size:46px}
.item{display:flex;gap:10px;align-items:center}.item>.txt{flex:1;min-width:0}
</style>
</head>
<body>

<header>
  <div class="dateRow">
    <button id="prevDay">›</button>
    <div id="dateLabel"></div>
    <button id="nextDay">‹</button>
  </div>
  <div class="big"><span id="totKcal">0</span> <span class="sub">/ <span id="goalKcal">2000</span> קל׳</span></div>
  <div class="bar" id="barWrap"><div id="bar" style="width:0"></div></div>
  <div class="sub">נשאר: <span id="left">2000</span> קל׳</div>
  <div class="macros">
    <div><div class="sub">חלבון</div><div><span id="totP">0</span>/<span id="goalP">0</span> ג׳</div><div class="bar sm" id="bwP"><div id="bP"></div></div></div>
    <div><div class="sub">פחמימה</div><div><span id="totC">0</span>/<span id="goalC">0</span> ג׳</div><div class="bar sm" id="bwC"><div id="bC"></div></div></div>
    <div><div class="sub">שומן</div><div><span id="totF">0</span>/<span id="goalF">0</span> ג׳</div><div class="bar sm" id="bwF"><div id="bF"></div></div></div>
  </div>
</header>

<main>
  <!-- היום -->
  <section class="view on" id="v-today">
    <div id="list"></div>
  </section>

  <!-- סריקה -->
  <section class="view" id="v-scan">
    <video id="video" playsinline muted></video>
    <div class="msg" id="scanMsg">כוון את המצלמה לברקוד</div>
    <div class="row">
      <input id="manualCode" inputmode="numeric" placeholder="או הקלד ברקוד">
      <button class="btn" style="flex:0 0 90px;margin-top:6px" id="manualGo">חפש</button>
    </div>
  </section>

  <!-- חיפוש -->
  <section class="view" id="v-search">
    <div class="row">
      <input id="q" placeholder="חפש מוצר (למשל: קוטג׳, במבה)">
      <button class="btn" style="flex:0 0 90px;margin-top:6px" id="qGo">חפש</button>
    </div>
    <div id="results"></div>
    <button class="btn gray" id="addManual">+ הוסף ידנית</button>
  </section>

  <!-- מוצר -->
  <section class="view" id="v-product">
    <div class="card" style="display:flex;gap:12px;align-items:center">
      <div style="text-align:center"><div id="pPic" class="pic big"></div><div class="sub" id="picBtn" style="font-size:12px;margin-top:4px;color:#8bc34a">החלף תמונה</div><input type="file" id="picFile" accept="image/*" hidden></div>
      <div><div class="n" id="pName" style="font-size:20px"></div>
      <div class="sub" id="pInfo"></div></div>
    </div>
    <label>כמות (גרם / מ״ל)</label>
    <input id="grams" type="number" inputmode="decimal" value="100">
    <div class="card" id="pCalc"></div>
    <button class="btn" id="addBtn">הוסף ליומן</button>
    <button class="btn gray" id="cancelBtn">ביטול</button>
  </section>

  <!-- מוצר חדש -->
  <section class="view" id="v-new">
    <div class="msg" id="newMsg">המוצר לא נמצא במאגר. הכנס נתונים מהאריזה (ל-100 גרם) — זה יישמר לפעם הבאה.</div>
    <label>שם המוצר</label><input id="nName">
    <label>קלוריות ל-100 ג׳</label><input id="nKcal" type="number" inputmode="decimal">
    <div class="row">
      <div><label>חלבון</label><input id="nProt" type="number" inputmode="decimal"></div>
      <div><label>פחמימה</label><input id="nCarb" type="number" inputmode="decimal"></div>
      <div><label>שומן</label><input id="nFat" type="number" inputmode="decimal"></div>
    </div>
    <button class="btn" id="saveNew">שמור והמשך</button>
    <button class="btn gray" id="cancelNew">ביטול</button>
  </section>

  <!-- הגדרות -->
  <section class="view" id="v-settings">
    <div class="sub">יעדים יומיים (בגרמים)</div>
    <label>חלבון</label><input id="gP" type="number" inputmode="numeric">
    <label>פחמימה</label><input id="gC" type="number" inputmode="numeric">
    <label>שומן</label><input id="gF" type="number" inputmode="numeric">
    <div class="card" id="goalCalc"></div>
    <button class="btn" id="saveGoal">שמור</button>
    <div class="card sub" style="margin-top:16px">נתוני המוצרים מגיעים מ-Open Food Facts. מוצרים שהוספת ידנית והיומן נשמרים בטלפון הזה בלבד.</div>
  </section>
</main>

<nav>
  <button data-v="today" class="on">היום</button>
  <button data-v="scan">סריקה</button>
  <button data-v="search">חיפוש</button>
  <button data-v="settings">הגדרות</button>
</nav>

<script src="foods.js"></script>
<script>
const $ =id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let day = new Date(); day.setHours(0,0,0,0);
let current = null; // {code,name,kcal,prot}
const OFF = 'https://world.openfoodfacts.org';
const FIELDS = 'code,product_name,product_name_he,brands,nutriments,image_front_small_url';
const EMOJI = [
  ['אבקת חלבון','💪'],['חלבה','🍬'],['מרק','🍲'],['גבינת','🧀'],['לחמניה','🥯'],['חמאת בוטנים','🥜'],['תפוצ׳יפס','🥔'],['מיץ','🧃'],['תפוח אדמה','🥔'],['פירה','🥔'],['צ׳יפס','🍟'],
  ['בטטה','🍠'],['קפה','☕'],['ממרח שוקולד','🍫'],['שוקולד','🍫'],['שוקו','🥛'],['פריכיות','🍘'],['קרקר','🍘'],
  ['פיתה','🫓'],['לאפה','🫓'],['טורטיה','🫓'],['קרואסון','🥐'],['בורקס','🥟'],['טוסט','🥪'],['לחם','🍞'],['חלה','🍞'],['באגט','🥖'],
  ['סביח','🥙'],['מג׳דרה','🍚'],['אורז','🍚'],['סושי','🍣'],['פסטה','🍝'],['פתיתים','🍝'],['קוסקוס','🥣'],['בורגול','🥣'],['קינואה','🥣'],
  ['שיבולת','🥣'],['גרנולה','🥣'],['קורנפלקס','🥣'],['תירס','🌽'],['פלאפל','🧆'],['חומוס','🫘'],['טחינה','🫘'],['עדשים','🫘'],
  ['שעועית','🫘'],['אפונה','🫛'],['אדממה','🫛'],['טופו','🫘'],['המבורגר','🍔'],['נקניקיה','🌭'],['פסטרמה','🥓'],['שניצל','🍗'],
  ['עוף','🍗'],['פרגית','🍗'],['הודו','🍗'],['בקר','🥩'],['סטייק','🥩'],['קבב','🥩'],['קציצות','🥩'],['סלמון','🐟'],['טונה','🐟'],
  ['אמנון','🐟'],['דניס','🐟'],['סרדינים','🐟'],['דג','🐟'],['שקשוקה','🍳'],['חביתה','🍳'],['ביצה','🥚'],['פיצה','🍕'],
  ['ג׳חנון','🥞'],['מלאווח','🥞'],['מרק','🍲'],['גבינה','🧀'],['קוטג','🧀'],['לבנה','🧀'],['יוגורט','🥛'],['מעדן','🥛'],['חלב','🥛'],
  ['שמנת','🧈'],['חמאה','🧈'],['מלפפון','🥒'],['עגבניה','🍅'],['סלט','🥗'],['חסה','🥬'],['גזר','🥕'],['פלפל','🫑'],['בצל','🧅'],
  ['ברוקולי','🥦'],['כרובית','🥦'],['כרוב','🥬'],['תרד','🥬'],['חציל','🍆'],['קישוא','🥒'],['פטריות','🍄'],['אבוקדו','🥑'],
  ['זית','🫒'],['חמוצים','🥒'],['תפוח','🍎'],['בננה','🍌'],['תפוז','🍊'],['קלמנטינה','🍊'],['אגס','🍐'],['ענבים','🍇'],['צימוקים','🍇'],
  ['אבטיח','🍉'],['מלון','🍈'],['תות','🍓'],['מנגו','🥭'],['אננס','🍍'],['אפרסק','🍑'],['שזיף','🍑'],['קיווי','🥝'],['רימון','🍒'],
  ['תמר','🌴'],['שקדים','🥜'],['אגוז','🥜'],['קשיו','🥜'],['בוטנים','🥜'],['פיסטוק','🥜'],['גרעינים','🌻'],['גרעיני','🎃'],['צ׳יה','🌱'],
  ['שמן','🫒'],['מיונז','🥫'],['קטשופ','🍅'],['חרדל','🥫'],['סילאן','🍯'],['דבש','🍯'],['ריבה','🍓'],['סוכר','🍬'],['במבה','🥜'],
  ['ביסלי','🥨'],['עוגיות','🍪'],['עוגה','🍰'],['עוגת','🍰'],['גלידה','🍦'],['חלבה','🍬'],['ופל','🧇'],['קולה','🥤'],['בירה','🍺'],['יין','🍷']
];
const emojiFor = name => (EMOJI.find(([k]) => (name || '').includes(k)) || [,'🍽️'])[1];
const myImgs = () => store.get('myImgs', {});
const PH = '<span class="ph">אין<br>תמונה</span>';
function picHTML(p){
  const src = myImgs()[p.name] || p.img;
  return src ? `<img src="${String(src).replace(/"/g,'')}" loading="lazy" alt="" onerror="this.parentNode.innerHTML='${PH.replace(/'/g,"\\'")}'">` : PH;
}

const key = () => 'log-' + day.toISOString().slice(0,10);
const macros = () => store.get('macros', { p: 150, c: 200, f: 67 });
const kcalOf = m => m.p * 4 + m.c * 4 + m.f * 9;
const goal = () => kcalOf(macros());
const fmt = (x, d=1) => (+x || 0).toFixed(d).replace(/\.0$/, '');
function macroBar(id, tot, g){
  $('tot'+id).textContent = fmt(tot); $('goal'+id).textContent = g;
  $('b'+id).style.width = (g ? Math.min(100, tot / g * 100) : 0) + '%';
  $('bw'+id).classList.toggle('over', g && tot > g * 1.05);
}
const myFoods = () => store.get('myFoods', {});

function render(){
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((today - day) / 864e5);
  $('dateLabel').textContent = diff === 0 ? 'היום' : diff === 1 ? 'אתמול' : day.toLocaleDateString('he-IL');
  const log = store.get(key(), []);
  let k = 0, p = 0, c = 0, f = 0;
  $('list').innerHTML = log.length ? '' : '<div class="msg">עוד לא נרשם כלום. סרוק ברקוד או חפש מוצר.</div>';
  log.forEach((e, i) => {
    k += e.kcal; p += e.prot; c += e.carb || 0; f += e.fat || 0;
    const d = document.createElement('div');
    d.className = 'card entry item';
    d.innerHTML = `<div class="pic">${picHTML(e)}</div><div class="txt"><div class="n"></div><div class="sub">${e.grams} ג׳ · ${Math.round(e.kcal)} קל׳ · ח ${fmt(e.prot)} · פ ${fmt(e.carb)} · ש ${fmt(e.fat)}</div></div><button class="del">✕</button>`;
    d.querySelector('.n').textContent = e.name;
    d.querySelector('.del').onclick = () => { log.splice(i,1); store.set(key(), log); render(); };
    $('list').appendChild(d);
  });
  const g = goal();
  $('totKcal').textContent = Math.round(k);
  $('goalKcal').textContent = g;
  const m = macros();
  macroBar('P', p, m.p); macroBar('C', c, m.c); macroBar('F', f, m.f);
  $('left').textContent = Math.round(g - k);
  $('bar').style.width = Math.min(100, k / g * 100) + '%';
  $('barWrap').classList.toggle('over', k > g);
}

function show(v){
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + v));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (v === 'scan') startScan(); else stopScan();
  if (v === 'settings') { const m = macros(); $('gP').value = m.p; $('gC').value = m.c; $('gF').value = m.f; goalCalc(); }
  window.scrollTo(0,0);
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.v));
$('prevDay').onclick = () => { day.setDate(day.getDate()-1); render(); };
$('nextDay').onclick = () => { day.setDate(day.getDate()+1); render(); };

// ---- product ----
function fromOFF(p){
  const n = p.nutriments || {};
  let kcal = n['energy-kcal_100g'];
  if (kcal == null && n['energy_100g'] != null) kcal = n['energy_100g'] / 4.184;
  return {
    code: p.code,
    img: p.image_front_small_url || '',
    name: (p.product_name_he || p.product_name || 'מוצר ללא שם') + (p.brands ? ' · ' + p.brands.split(',')[0] : ''),
    kcal: kcal == null ? null : +kcal,
    prot: +n['proteins_100g'] || 0,
    carb: +n['carbohydrates_100g'] || 0,
    fat: +n['fat_100g'] || 0
  };
}
function openProduct(p){
  if (p.kcal == null){ openNew(p.code, p.name, 'למוצר הזה אין נתוני קלוריות במאגר. הכנס מהאריזה (ל-100 גרם).'); return; }
  current = p;
  $('pName').textContent = p.name;
  $('pPic').innerHTML = picHTML(p);
  $('pInfo').textContent = `ל-100 ג׳: ${Math.round(p.kcal)} קל׳ · חלבון ${fmt(p.prot)} · פחמימה ${fmt(p.carb)} · שומן ${fmt(p.fat)}`;
  $('grams').value = 100;
  calc();
  show('product');
}
function calc(){
  const g = +$('grams').value || 0;
  const r = g / 100;
  $('pCalc').textContent = `${Math.round(current.kcal * r)} קלוריות · חלבון ${fmt(current.prot * r)} ג׳ · פחמימה ${fmt((current.carb||0) * r)} ג׳ · שומן ${fmt((current.fat||0) * r)} ג׳`;
}
$('grams').oninput = calc;
$('addBtn').onclick = () => {
  const g = +$('grams').value || 0;
  if (!g) return;
  const log = store.get(key(), []);
  const r = g / 100;
  log.push({ name: current.name, img: current.img || '', grams: g, kcal: current.kcal * r, prot: current.prot * r, carb: (current.carb||0) * r, fat: (current.fat||0) * r });
  store.set(key(), log);
  render(); show('today');
};
$('cancelBtn').onclick = () => show('today');

function openNew(code, name, msg){
  $('newMsg').textContent = msg || 'המוצר לא נמצא במאגר. הכנס נתונים מהאריזה (ל-100 גרם) — זה יישמר לפעם הבאה.';
  $('nName').value = name || ''; ['nKcal','nProt','nCarb','nFat'].forEach(i => $(i).value = '');
  $('saveNew').dataset.code = code || '';
  show('new');
}
$('saveNew').onclick = () => {
  const name = $('nName').value.trim(), prot = +$('nProt').value || 0, carb = +$('nCarb').value || 0, fat = +$('nFat').value || 0;
  let kcal = +$('nKcal').value || (prot * 4 + carb * 4 + fat * 9);
  if (!name || !kcal) { alertMsg('צריך שם וקלוריות (או אבות מזון)'); return; }
  const code = $('saveNew').dataset.code || ('my-' + Date.now());
  const foods = myFoods(); foods[code] = { code, name, kcal, prot, carb, fat }; store.set('myFoods', foods);
  openProduct(foods[code]);
};
$('cancelNew').onclick = () => show('today');
$('addManual').onclick = () => openNew('', $('q').value.trim());
function alertMsg(t){ $('newMsg').textContent = t; }

async function lookup(code){
  code = String(code).trim();
  if (!code) return;
  const mine = myFoods()[code];
  if (mine) { openProduct(mine); return; }
  $('scanMsg').textContent = 'מחפש ' + code + '...';
  try {
    const r = await fetch(`${OFF}/api/v2/product/${code}.json?fields=${FIELDS}`);
    const j = await r.json();
    if (j.status === 1 && j.product) openProduct(fromOFF(j.product));
    else openNew(code);
  } catch(e) {
    openNew(code, '', 'אין חיבור למאגר. אפשר להכניס את הנתונים ידנית.');
  }
}
$('manualGo').onclick = () => lookup($('manualCode').value);

// ---- search ----
async function search(){
  const q = $('q').value.trim();
  if (!q) return;
  const res = $('results');
  res.innerHTML = '<div class="msg">מחפש...</div>';
  const norm = s => s.replace(/[׳'"`״\-]/g, '').replace(/\s+/g, ' ').trim();
  const nq = norm(q);
  const mine = Object.values(myFoods()).filter(f => norm(f.name).includes(nq));
  const basic = (window.BASIC_FOODS || [])
    .filter(b => norm(b[0]).includes(nq))
    .sort((a, b) => norm(a[0]).indexOf(nq) - norm(b[0]).indexOf(nq) || a[0].length - b[0].length)
    .map(b => ({ code: 'basic-' + b[0], name: b[0], img: window.foodImg(b[0]), kcal: b[1], prot: b[2], carb: b[3], fat: b[4] }));
  let items = mine.concat(basic);
  try {
    const r = await fetch(`${OFF}/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&json=1&page_size=25&fields=${FIELDS}`);
    const j = await r.json();
    items = items.concat((j.products || []).map(fromOFF).filter(p => p.kcal != null));
  } catch(e) {}
  res.innerHTML = items.length ? '' : '<div class="msg">לא נמצאו תוצאות. אפשר להוסיף ידנית.</div>';
  items.forEach(p => {
    const d = document.createElement('div');
    d.className = 'card res';
    d.className = 'card res item';
    d.innerHTML = `<div class="pic">${picHTML(p)}</div><div class="txt"><div class="n"></div><div class="sub">ל-100 ג׳: ${Math.round(p.kcal)} קל׳ · ח ${fmt(p.prot)} · פ ${fmt(p.carb)} · ש ${fmt(p.fat)}</div></div>`;
    d.querySelector('.n').textContent = p.name;
    d.onclick = () => openProduct(p);
    res.appendChild(d);
  });
}
$('qGo').onclick = search;
$('q').onkeydown = e => { if (e.key === 'Enter') search(); };

// ---- scanner ----
let stream = null, detector = null, scanning = false;
async function startScan(){
  if (!('BarcodeDetector' in window)) { $('scanMsg').textContent = 'הדפדפן לא תומך בסריקה — הקלד את הברקוד'; return; }
  try {
    detector = detector || new BarcodeDetector({ formats: ['ean_13','ean_8','upc_a','upc_e','code_128'] });
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const v = $('video'); v.srcObject = stream; await v.play();
    scanning = true; $('scanMsg').textContent = 'כוון את המצלמה לברקוד';
    loop();
  } catch(e) { $('scanMsg').textContent = 'אין גישה למצלמה — הקלד את הברקוד'; }
}
async function loop(){
  if (!scanning) return;
  try {
    const codes = await detector.detect($('video'));
    if (codes.length) { const c = codes[0].rawValue; stopScan(); if (navigator.vibrate) navigator.vibrate(80); lookup(c); return; }
  } catch(e) {}
  setTimeout(loop, 250);
}
function stopScan(){
  scanning = false;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}

// ---- settings ----
const readGoals = () => ({ p: +$('gP').value || 0, c: +$('gC').value || 0, f: +$('gF').value || 0 });
function goalCalc(){
  const m = readGoals();
  $('goalCalc').textContent = `חלבון ${m.p * 4} + פחמימה ${m.c * 4} + שומן ${m.f * 9} = ${kcalOf(m)} קלוריות ביום`;
}
['gP','gC','gF'].forEach(i => $(i).oninput = goalCalc);
$('saveGoal').onclick = () => { const m = readGoals(); if (kcalOf(m) > 0) { store.set('macros', m); render(); show('today'); } };

function setMyPic(){ $('picFile').click(); }
$('pPic').onclick = setMyPic; $('picBtn').onclick = setMyPic;
$('picFile').onchange = e => {
  const f = e.target.files[0]; if (!f || !current) return;
  const img = new Image();
  img.onload = () => {
    const S = 200, c = document.createElement('canvas'); c.width = c.height = S;
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,S,S);
    const r = Math.min(S / img.width, S / img.height), w = img.width * r, h = img.height * r;
    x.drawImage(img, (S-w)/2, (S-h)/2, w, h);
    const m = myImgs(); m[current.name] = c.toDataURL('image/jpeg', .8); store.set('myImgs', m);
    $('pPic').innerHTML = picHTML(current); render();
    URL.revokeObjectURL(img.src); e.target.value = '';
  };
  img.src = URL.createObjectURL(f);
};

render();
</script>
